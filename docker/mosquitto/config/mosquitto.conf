persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
persistence true

# Local Foundation deployment only.
# Before exposing MQTT outside a trusted development machine, enable TLS,
# password authentication and topic ACLs.
