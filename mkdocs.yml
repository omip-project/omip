site_name: Open Mission Intelligence Platform
site_description: Mission Data Infrastructure for Heterogeneous Autonomous Vehicles
site_url: https://omip-project.github.io/omip/
repo_url: https://github.com/omip-project/omip
repo_name: omip-project/omip
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
  - Architecture:
      - Overview: architecture/index.md
      - Core Data Model: core-data-model.md
  - Platform:
      - Vehicle Profiles: vehicle-profiles.md
      - Simulator: simulator.md
  - Deployment:
      - Overview: deployment/index.md
  - Development:
      - Contributor Guide: development/index.md
  - Roadmap: roadmap.md
  - FAQ: faq.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; OMIP contributors
